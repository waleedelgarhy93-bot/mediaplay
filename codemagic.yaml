workflows:
  android-native-apk:
    name: Build Native Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 21
    scripts:
      - name: Update Gradle Wrapper & Build Debug APK
        script: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i.bak 's/gradle-[0-9.]*-bin.zip/gradle-9.3.1-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          fi
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle wrapper --gradle-version 9.3.1
            ./gradlew assembleDebug
          fi
    artifacts:
      - app/build/outputs/apk/debug/*.apk
